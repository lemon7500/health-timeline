name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harmony-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: node scripts/check-build-security.mjs --self-test
      - run: node scripts/check-build-security.mjs
      - run: node scripts/validate-harmony-v4.mjs
      - run: node scripts/validate-backup-v5.mjs

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Check that unsafe KAPT caching is rejected
        shell: bash
        run: |
          if ./gradlew :androidApp:verifyBuildToolchain -Pkapt.incremental.apt=true > "$RUNNER_TEMP/kapt-negative.log" 2>&1; then
            echo '::error::Unsafe KAPT cache override was accepted.'
            exit 1
          fi
          grep -F 'has an incremental APT worker cache directory' "$RUNNER_TEMP/kapt-negative.log"
      - run: ./gradlew :androidApp:verifyBuildToolchain :shared:core:testDebugUnitTest :androidApp:testDebugUnitTest :androidApp:lintRelease :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :androidApp:assembleRelease --stacktrace
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      - name: Upload JVM test and release lint reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: jvm-tests-and-release-lint
          if-no-files-found: warn
          path: |
            apps/android/app/build/test-results/testDebugUnitTest/
            shared/core/build/test-results/testDebugUnitTest/
            apps/android/app/build/reports/lint-results-release.*

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Room migration, integrity and Today UI tests
        id: android-instrumentation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash -o pipefail -c './gradlew :androidApp:verifyBuildToolchain :androidApp:connectedDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-instrumentation.log"'
      - name: Publish Android instrumentation errors
        if: failure() && steps.android-instrumentation.outcome == 'failure'
        shell: bash
        run: |
          error_lines="$(grep -E 'FAILED|FAILURES|AssertionError|Exception|There (was|were) [0-9]+ failure' "$RUNNER_TEMP/android-instrumentation.log" | tail -n 50 || true)"
          if [[ -z "$error_lines" ]]; then
            echo '::error::Android instrumentation failed without a matched test error; inspect the uploaded report and log.'
          else
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            done <<< "$error_lines"
          fi
      - name: Upload Android instrumentation report
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-instrumentation-report
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/android-instrumentation.log
            apps/android/app/build/reports/androidTests/connected/
            apps/android/app/build/outputs/androidTest-results/connected/

  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - run: xcodebuild -version
      - run: ./gradlew :androidApp:verifyBuildToolchain :shared:core:linkDebugFrameworkIosSimulatorArm64
      - run: brew install xcodegen cocoapods
      - run: xcodegen generate
        working-directory: apps/ios
      - run: pod install
        working-directory: apps/ios
      - name: Build iOS simulator
        id: ios-build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -workspace HealthTimeline.xcworkspace -scheme HealthTimeline -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/ios-build.log"
        working-directory: apps/ios
      - name: Publish iOS compiler errors
        if: failure() && steps.ios-build.outcome == 'failure'
        shell: bash
        run: |
          error_lines="$(grep -E '(^|[[:space:]])(error|fatal error):' "$RUNNER_TEMP/ios-build.log" | tail -n 50 || true)"
          if [[ -z "$error_lines" ]]; then
            echo '::error::xcodebuild failed without a compiler error line; inspect the uploaded ios-build-log artifact.'
          else
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            done <<< "$error_lines"
          fi
      - name: Upload iOS build log
        if: failure() && steps.ios-build.outcome == 'failure'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/ios-build.log
      - name: Run iOS simulator tests
        id: ios-tests
        shell: bash
        run: |
          set -o pipefail
          simulator_id="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          if [[ -z "$simulator_id" ]]; then
            xcrun simctl list devices available
            echo '::error::No available iPhone simulator was found on the GitHub runner.'
            exit 1
          fi
          echo "Using iPhone simulator $simulator_id"
          xcodebuild -workspace HealthTimeline.xcworkspace -scheme HealthTimeline -sdk iphonesimulator -destination "platform=iOS Simulator,id=$simulator_id" -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult" CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/ios-test.log"
        working-directory: apps/ios
      - name: Publish iOS test errors
        if: failure() && steps.ios-tests.outcome == 'failure'
        shell: bash
        run: |
          error_lines="$(grep -E 'error:|Test Case .* failed|XCTAssert|Unable to find a destination' "$RUNNER_TEMP/ios-test.log" | tail -n 50 || true)"
          if [[ -z "$error_lines" ]]; then
            echo '::error::iOS tests failed without a matched error line; inspect the uploaded ios-test-log artifact.'
          else
            while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error::$line"
            done <<< "$error_lines"
          fi
      - name: Upload iOS test log
        if: always() && steps.ios-tests.outcome != 'skipped'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: ios-test-report
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ios-test.log
            ${{ runner.temp }}/ios-tests.xcresult/
